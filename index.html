<title>Cinematic Slides v2 · WebGL2 deck</title>
<style>

<body>
<canvas id="stage" tabindex="0" aria-label="簡報畫面"></canvas>

<script>
(() => {
'use strict';

/* =========================================================
   1. 內容：改 SLIDES 就換到成份 deck
   layout: 'hero' | 'list'
   bg:     scene 名（見下面 DARK）
   tr:     去下一頁用嘅 transition（見下面 TR）
   body:   每粒 bullet 係一步（按一下出一粒）
   ========================================================= */
const DECK_TITLE = 'Cinematic Slides v2';
const SLIDES = [
  { id: 'intro', layout: 'hero', bg: 'space', tr: 'portal', accent: '#7cc4ff',
    kicker: 'WebGL2 簡報引擎', title: '一個 HTML，\n十三個世界',
    sub: '13 個 procedural scene、10 款 shader 轉場，全部喺 GPU 即時計，離線都開到。',
    notes: '呢份 deck 自己就係說明書：每一頁用一個唔同嘅 scene，頁與頁之間用唔同嘅轉場。冇 library、冇圖片、冇外部字型。按 → 或者 Space 開始。' },
  { id: 'concept', layout: 'list', bg: 'mountains', tr: 'fold', accent: '#ffb36b',
    kicker: '設計概念', title: '一頁一個 scene',
    body: [
      '底層：全屏 GLSL scene，負責氣氛同情緒',
      '面層：Canvas 2D 文字，負責講清楚重點',
      '中間：shader 轉場，交代頁與頁嘅關係',
      '克制：一頁一個 idea，最多 5 粒 bullet'
    ],
    notes: '日出山脈係 6 層 ridgeline，越遠越淡（atmospheric perspective），山谷有霧慢慢飄。下一頁用 fold：成頁好似紙咁摺埋飛走。' },
  { id: 'text', layout: 'list', bg: 'paper', tr: 'tear', accent: '#b8431c',
    kicker: '文字層', title: '啲字點樣疊上去',
    body: [
      'Canvas 2D 先畫字，中英混排自動換行',
      '上載做 premultiplied texture，3 個 slot 輪住用',
      'Scene shader 最後一步先 composite 文字',
      'DARK map：深 scene 用白字加陰影，淺 scene 用深字'
    ],
    notes: '換行規則喺 wrap()：標點唔做行頭、最後一行唔會淨一兩隻字。文字 texture 用 LRU 三格 cache，step 動畫期間先會重畫。下一頁用 tear：撕紙。' },
  { id: 'noise', layout: 'list', bg: 'moon', tr: 'wash', accent: '#c9d4ff',
    kicker: 'Scene 原理', title: '冇一張圖，全部係 noise',
    body: [
      'hash → value noise → fbm，最多 5 個 octave',
      'Domain warp 整流動感：雲、霧、雲石',
      '月球隕石坑：每格 cell 算一個坑，有 rim 同陰影',
      '全部 motion 都要細同慢，唔好搶咗啲字'
    ],
    notes: '月球每個坑都係 3D cell 入面隨機擺一個圓，用 rim 同 bowl 嘅斜度計光暗，所以近 terminator 嗰邊特別立體。下一頁用 wash：水浪掃過。' },
  { id: 'formula', layout: 'list', bg: 'ocean', tr: 'slam', accent: '#ffc46b',
    kicker: '轉場原理', title: '轉場其實係一條公式',
    body: [
      'A、B 兩頁各自畫落 offscreen texture',
      '全屏 shader 讀 A、B 同 progress p（0 → 1）',
      'p = 0 一定係 A，p = 1 一定係 B',
      '返轉頭：A、B 對調，p = 1 − p，倒播都啱'
    ],
    notes: '海面係簡化 raytrace：每粒 pixel 射一條線落水面，用 5 條 sine wave 計法線，再反射天空同太陽。下一頁用 slam：印刷機蓋印。' },
  { id: 'paper', layout: 'list', bg: 'city', tr: 'glitch', accent: '#ff7ab0',
    kicker: '轉場一覽 · 上', title: '紙同水嘅質感',
    body: [
      'fold：摺紙，有摺痕高光、紙背纖維同投影',
      'tear：撕紙，鋸齒邊、白色纖維、兩塊飛開',
      'wash：水浪掃過，前面折射 A，後面折射 B',
      'slam：蓋印 overshoot，加油墨網點慢慢散開',
      'flaps：一格格翻牌，好似機場告示板'
    ],
    notes: '夜景分三層深度，窗口隔一陣自己開關，天上有架飛機閃住燈慢慢飛過。下一頁用 glitch：訊號壞咗，中途切去下一頁。' },
  { id: 'signal', layout: 'list', bg: 'terminal', tr: 'line', accent: '#7dffa8',
    kicker: '轉場一覽 · 下', title: '光同訊號',
    body: [
      'glitch：block 錯位、RGB split、中途切 B',
      'line：舊 CRT 熄機，壓成一條線再拉開',
      'portal：中間開個光圈，舊頁推埋嚟',
      'dissolve：noise 燒穿，邊緣發光',
      'fade：最基本，亦係減少動態時嘅後備'
    ],
    notes: 'Terminal scene 自己 composite 文字：輕微 barrel curvature、scanline、phosphor glow，但係 curvature 好細，字仍然清楚。' },
  { id: 'rhythm', layout: 'list', bg: 'aurora', tr: 'dissolve', accent: '#5ef2c1',
    kicker: '節奏', title: '一步一步講',
    body: [
      '每粒 bullet 係一個 step，按一下先出一粒',
      '網址 #id-step 記住你去到邊，refresh 都唔甩',
      'Step 出現嗰陣，scene 鏡頭會輕輕推前',
      'N 睇 speaker notes，O 睇 overview'
    ],
    notes: '極光下面加咗山同湖，湖面反射極光。鏡頭推前（uCam）係按 step 進度慢慢 ease，唔會跳。' },
  { id: 'contrast', layout: 'list', bg: 'dunes', tr: 'flaps', accent: '#9a3b12',
    kicker: '對比度', title: '淺底深字，深底白字',
    body: [
      'DARK map 決定每個 scene 用白字定深字',
      '文字範圍有柔和 scrim，背景再花都睇得清',
      'Kicker 用 accent 色：淺 scene 要揀深色',
      '手機直向 390 × 844 都要逐頁檢查'
    ],
    notes: '沙丘係淺色 scene：DARK.dunes = false，所以字係深色，加淺色 halo。地平線附近有熱浪 shimmer。' },
  { id: 'fallback', layout: 'list', bg: 'clouds', tr: 'fade', accent: '#1f5fbf',
    kicker: '後備方案', title: '壞咗都要睇得到',
    body: [
      '冇 WebGL2 或者 shader 失敗：自動轉 2D 淡入淡出',
      'prefers-reduced-motion：全部轉場變 0.45 秒 fade',
      'GPU context 甩咗：恢復之後自動 reload',
      'Notes 同 overview 係 HTML，screen reader 讀到'
    ],
    notes: '雲海係一塊 fbm 平面，向太陽嗰邊計亮邊；近鏡嘅雲絲用兩層 infinite zoom 交替，營造向前飛嘅感覺。' },
  { id: 'budget', layout: 'list', bg: 'synthwave', tr: 'wash', accent: '#ff5fd2',
    kicker: '效能預算', title: '60 fps 先叫電影感',
    body: [
      '目標：1920 × 1080，普通 laptop iGPU 跑 60 fps',
      'fbm 最多 5 個 octave，loop 唔超過 48 次',
      'DPR 上限 2，總像素有 MAX_PIX 上限',
      '慢機自動降解像度，成個 file 唔超過 250 KB'
    ],
    notes: 'Grid 用 fwidth 做 anti-aliasing，越近地平線越淡，避免 moiré。如果連續幾秒 frame time 太長，engine 會自動降少少內部解像度。' },
  { id: 'extend', layout: 'list', bg: 'marble', tr: 'fold', accent: '#ffd27a',
    kicker: '擴充', title: '加 scene，加轉場',
    body: [
      'Scene：寫 BG_XXX，加入 PROG.bg、DARK 同 BG2D',
      '轉場：寫 TR_XXX，加入 TR（長度）同 PROG.tr',
      '?tr=xxx&p=0.5&a=1&b=2：停喺某一格慢慢調',
      'npm test：截圖、console error、鍵盤行晒全份'
    ],
    notes: '雲石係兩層 domain warp：q 推 r，r 推最後嘅 f。三隻 accent 色按唔同 warp 層混入去。' },
  { id: 'reuse', layout: 'hero', bg: 'bokeh', tr: 'fade', accent: '#ffcf8a',
    kicker: '輪到你', title: '改 SLIDES，\n變成你嘅 deck',
    sub: '複製 index.html，改內容、揀 scene 同轉場，跑一次 npm test，就可以 share 一個 file 或者上 GitHub Pages。',
    notes: '詳細做法睇 README 同 skill/SKILL.md。記住：一頁一個 idea，motion 要有意思。' }
];

/* =========================================================
   2. Transition 長度（秒）。每款對應下面一個 TR_* shader。
   ========================================================= */
const TR = {
  fade:     { dur: 1.1 },
  dissolve: { dur: 1.6 },
  flaps:    { dur: 1.9 },
  line:     { dur: 1.3 },
  portal:   { dur: 1.5 },
  fold:     { dur: 2.1 },
  wash:     { dur: 1.8 },
  slam:     { dur: 1.4 },
  tear:     { dur: 2.0 },
  glitch:   { dur: 1.1 }
};
// 每個 scene 係深底（白字）定淺底（深字）
const DARK = {
  space: true, aurora: true, paper: false, mountains: true, moon: true, city: true, ocean: true,
  dunes: false, clouds: false, synthwave: true, marble: true, terminal: true, bokeh: true
};
// 只認自己定義嘅 key（防 ?tr=constructor 之類）
const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);


/* =========================================================
   3. Shaders
   ========================================================= */
const VS = '#version 300 es\n' + `
out vec2 vUv;
void main(){
  vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));
  vUv=p;
  gl_Position=vec4(p*2.-1.,0.,1.);
}`;

const HEAD = '#version 300 es\n' + `
precision highp float;
precision highp int;
in vec2 vUv;
out vec4 o;
uniform float uTime;
uniform float uAsp;
uniform float uP;
uniform vec2 uRes;
uniform vec3 uAccent;
uniform float uCam;
uniform float uDark;
const float PI=3.14159265;
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float hash13(vec3 p3){ p3=fract(p3*.1031); p3+=dot(p3,p3.zyx+31.32); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1.,0.)),u.x),mix(hash12(i+vec2(0.,1.)),hash12(i+vec2(1.,1.)),u.x),u.y); }
float vnoise3(vec3 p){ vec3 i=floor(p), f=fract(p); vec3 u=f*f*(3.-2.*f);
  float a=mix(mix(hash13(i),hash13(i+vec3(1.,0.,0.)),u.x),mix(hash13(i+vec3(0.,1.,0.)),hash13(i+vec3(1.,1.,0.)),u.x),u.y);
  float b=mix(mix(hash13(i+vec3(0.,0.,1.)),hash13(i+vec3(1.,0.,1.)),u.x),mix(hash13(i+vec3(0.,1.,1.)),hash13(i+vec3(1.,1.,1.)),u.x),u.y);
  return mix(a,b,u.z); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*vnoise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s; }
float fbm3(vec2 p){ float s=0., a=.5; for(int i=0;i<3;i++){ s+=a*vnoise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s*1.143; }
float fbmv(vec3 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*vnoise3(p); p=p*2.02+vec3(1.7,9.2,3.1); a*=.5; } return s; }
float easeIO(float t){ t=clamp(t,0.,1.); return t<.5?4.*t*t*t:1.-pow(-2.*t+2.,3.)*.5; }
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,s,-s,c); }
vec2 scr(){ return (vUv-.5)*vec2(uAsp,1.); }
// 鏡頭：step reveal 時輕輕推前（uCam 0 → 1）
vec2 camP(){ return scr()*(1.-.05*uCam)+vec2(.04,.018)*uCam; }
// 文字大概喺邊：landscape 左邊，portrait 上中段
float textZone(){
  if(uAsp>=1.) return (1.-smoothstep(.10,.78,vUv.x))*(.45+.55*smoothstep(.04,.55,vUv.y));
  return .3+.7*smoothstep(.12,.42,vUv.y)*(1.-smoothstep(.86,1.,vUv.y));
}
// film grain + 輕微 vignette
vec3 post(vec3 c){
  c=max(c,vec3(0.));
  vec2 v=vUv-.5; c*=1.-.22*dot(v,v);
  float g=hash12(floor(vUv*uRes)+fract(uTime*7.31)*173.)-.5;
  float l=clamp(dot(c,vec3(.3,.55,.15)),0.,1.);
  return c+g*.03*(.35+.65*sqrt(l));
}
`;

// 背景 shader 共用：scrim（保證對比）+ 文字 texture（premultiplied alpha）+ post
const TEXT = `
uniform sampler2D tText;
vec3 withText(vec3 bg){
  bg=max(bg,vec3(0.));
  float z=textZone();
  bg=uDark>.5?bg*(1.-.36*z):mix(bg,vec3(1.,.99,.97),.24*z);
  vec4 t=texture(tText,vUv);
  return post(bg*(1.-t.a)+t.rgb);
}
`;

const STARS = `
vec3 starLayer(vec2 p,float scale,float seed,float thr){
  vec2 g=p*scale; vec2 id=floor(g); vec2 f=fract(g)-.5;
  float h=hash12(id+seed);
  if(h<thr) return vec3(0.);
  vec2 off=vec2(hash12(id+seed+7.1),hash12(id+seed+3.7))-.5;
  float d=length(f-off*.7);
  float tw=.62+.38*sin(uTime*(1.1+2.6*h)+h*80.);
  vec3 col=mix(vec3(1.,.86,.72),vec3(.74,.84,1.),hash12(id+seed+11.3));
  float k=(h-thr)/(1.-thr);
  return col*(1.-smoothstep(0.,.11,d))*tw*(.45+1.6*k);
}
`;

// 星空 + 星雲 + 一個會轉嘅地球（夜面有城市燈）
const BG_SPACE = TEXT + STARS + `
void main(){
  vec2 p=camP();
  vec3 col=vec3(.010,.013,.030)+vec3(.015,.025,.055)*(1.-vUv.y);
  float n=fbm(p*1.25+vec2(uTime*.004,0.));
  float n2=fbm(p*2.6-vec2(0.,uTime*.003)+4.);
  col+=vec3(.11,.045,.21)*smoothstep(.42,.86,n)*.85+vec3(.02,.09,.18)*smoothstep(.45,.92,n2);
  vec2 dr=vec2(uTime*.0025,0.);
  col+=starLayer(p+dr,55.,1.,.965)+starLayer(p+dr*.6,105.,7.,.972)*.8+starLayer(p+dr*.3,190.,13.,.98)*.6;
  bool port=uAsp<1.;

float edgeX(float y){ return (fbm(vec2(y*3.,7.))-.5)*.22+(vnoise(vec2(y*38.,3.))-.5)*.035+(hash12(vec2(floor(y*160.),1.))-.5)*.008; }

uniform sampler2D tA,tB;
vec3 smp(bool useB,vec2 uv,float ca){

const CJK = /[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF\u3000-\u303F]/;
const NO_START = /^[，。、；：！？）」』】》〉,.;:!?)\]]/;

function tokenize(str) {
  const out = []; let buf = '';
  for (const ch of str) {
    if (CJK.test(ch)) { if (buf) { out.push(buf); buf = ''; } out.push(ch); }
    else if (ch === ' ') { buf += ch; out.push(buf); buf = ''; }
    else buf += ch;
  }
  if (buf) out.push(buf);
  return out;
}
function wrap(g, str, maxW) {
  const out = [];
  const width = toks => g.measureText(toks.join('').trimEnd()).width;
  for (const para of String(str).split('\n')) {
    const lines = [[]];
    for (const tk of tokenize(para)) {
      const cur = lines[lines.length - 1];
      if (cur.length && width(cur.concat(tk)) > maxW && !NO_START.test(tk)) lines.push([tk.trimStart()]);
      else cur.push(tk);
    }
    // 避免最後一行得一兩隻字，亦唔好用標點開頭
    if (lines.length > 1) {
      const last = lines[lines.length - 1], before = lines[lines.length - 2];
      while (before.length > 1 && ([...last.join('').trim()].length <= 3 || NO_START.test(last[0]))) {
        const moved = before.pop();
        last.unshift(moved);
        if (width(last) > maxW) { last.shift(); before.push(moved); break; }
      }
    }
    for (const l of lines) out.push(l.join('').trim());

}

function spacing(g, px) { if ('letterSpacing' in g) g.letterSpacing = px + 'px'; }
const easeOut = t => 1 - Math.pow(1 - clamp01(t), 3);

function drawSlide(g, s, step, anim, W, H) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, W, H);
  const portrait = W < H * 0.95;
  const S = portrait ? W / 1000 : Math.min(W / 1920, H / 1080);
  const dark = has(DARK, s.bg) ? DARK[s.bg] : true;
  const ink = dark ? '#f3f6fb' : '#17171c';
  const soft = dark ? 'rgba(226,232,244,0.88)' : 'rgba(34,32,40,0.84)';
  const mx = (portrait ? 70 : 150) * S;
  const maxW = W - mx * 2 - (portrait ? 0 : 300 * S);
  let y = s.layout === 'hero' ? H * (portrait ? 0.24 : 0.28) : (portrait ? 160 : 140) * S;
  g.textAlign = 'left';
  g.textBaseline = 'alphabetic';
  if (dark) { g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = 22 * S; g.shadowOffsetY = 2 * S; }
  else { g.shadowColor = 'rgba(255,252,246,0.7)'; g.shadowBlur = 16 * S; g.shadowOffsetY = 0; }

  if (s.kicker) {
    const ks = 26 * S;
    g.font = `700 ${ks}px ${FONT}`; g.fillStyle = s.accent; spacing(g, 3 * S);
    y += ks; g.fillText(s.kicker, mx, y); spacing(g, 0);
    g.fillRect(mx, y + 16 * S, 56 * S, 4 * S);
    y += 54 * S;
  }
  const ts = (s.layout === 'hero' ? 124 : 80) * S;
  g.font = `800 ${ts}px ${FONT}`; g.fillStyle = ink;
  for (const line of wrap(g, s.title, maxW)) { y += ts * 1.1; g.fillText(line, mx, y); }

  if (s.sub) {
    const ss = 38 * S;
    g.font = `500 ${ss}px ${FONT}`; g.fillStyle = soft; y += 24 * S;
    for (const line of wrap(g, s.sub, maxW)) { y += ss * 1.45; g.fillText(line, mx, y); }
  }
  if (s.layout === 'list' && s.body) {
    const bs = (portrait ? 44 : 40) * S, lh = bs * 1.5, ind = 46 * S;
    g.font = `500 ${bs}px ${FONT}`; y += 46 * S;
    for (let k = 0; k < s.body.length; k++) {
      const a = k < step - 1 ? 1 : (k === step - 1 ? easeOut(anim) : 0);
      if (a <= 0) continue;
      g.globalAlpha = a;
      const dy = (1 - a) * 26 * S;
      const base0 = y + lh;
      g.fillStyle = s.accent;
      g.beginPath(); g.arc(mx + 9 * S, base0 - bs * 0.36 + dy, 7 * S, 0, Math.PI * 2); g.fill();
      g.fillStyle = ink;
      for (const line of wrap(g, s.body[k], maxW - ind)) { y += lh; g.fillText(line, mx + ind, y + dy); }
      y += bs * 0.55;
      g.globalAlpha = 1;
    }
  }
  g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;
  const fs = 22 * S, fy = H - (portrait ? 110 : 70) * S;
  g.font = `600 ${fs}px ${FONT}`; g.fillStyle = soft;
  g.fillText(DECK_TITLE, mx, fy);
  g.textAlign = 'right';
  const idx = SLIDES.indexOf(s);
  g.fillText(String(idx + 1).padStart(2, '0') + ' / ' + String(N).padStart(2, '0'), W - mx, fy);
  g.textAlign = 'left';
}

// ---------- WebGL2 ----------
let gl = null, PROG = null, fboA = null, fboB = null, ctx2d = null;
const UNIFORMS = ['uTime', 'uAsp', 'uP', 'uRes', 'uAccent', 'uCam', 'uDark', 'tText', 'tA', 'tB'];

function compile(type, src) {

  gl.shaderSource(sh, src); gl.compileShader(sh);

    gl.deleteShader(sh);

}
function link(vs, fs) {

  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('Program link failed: ' + gl.getProgramInfoLog(p));

}
function buildPrograms() {

    bg: {
      space: mk(BG_SPACE), aurora: mk(BG_AURORA), paper: mk(BG_PAPER), mountains: mk(BG_MOUNTAINS), moon: mk(BG_MOON),
      city: mk(BG_CITY), ocean: mk(BG_OCEAN), dunes: mk(BG_DUNES), clouds: mk(BG_CLOUDS), synthwave: mk(BG_SYNTHWAVE),
      marble: mk(BG_MARBLE), terminal: mk(BG_TERMINAL), bokeh: mk(BG_BOKEH)
    },
    tr: {
      fade: mk(TR_FADE), dissolve: mk(TR_DISSOLVE), flaps: mk(TR_FLAPS), line: mk(TR_LINE), portal: mk(TR_PORTAL),
      fold: mk(TR_FOLD), wash: mk(TR_WASH), slam: mk(TR_SLAM), tear: mk(TR_TEAR), glitch: mk(TR_GLITCH)

function texParams() {

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);

function makeTarget(w, h, old) {

  texParams();
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

try {
  gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
} catch (e) { gl = null; }
if (gl) {
  try {
    PROG = buildPrograms();
    gl.bindVertexArray(gl.createVertexArray());
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.BLEND);
  } catch (err) {
    console.error(err);
    PROG = null;
  }
}
if (!PROG) {

}

// 文字 texture 用三個 slot 輪住用（LRU），慳 GPU 記憶體
const slots = [0, 1, 2].map(() => ({ key: '', tex: null, used: 0 }));
let useClock = 0;
function textTexture(idx, step, anim) {
  const key = idx + '|' + step + '|' + (anim >= 1 ? 1 : Math.round(anim * 60)) + '|' + W + 'x' + H;
  useClock++;
  let slot = slots.find(x => x.key === key);
  if (!slot) {
    slot = slots.reduce((m, x) => (x.used < m.used ? x : m), slots[0]);
    drawSlide(tctx, SLIDES[idx], step, anim, W, H);
    if (!slot.tex) { slot.tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, slot.tex); texParams(); }
    else gl.bindTexture(gl.TEXTURE_2D, slot.tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, textCanvas);
    slot.key = key;
  }
  slot.used = useClock;
  return slot.tex;
}

function renderSlideGL(target, idx, step, anim, t, cam) {
  const s = SLIDES[idx];
  const pr = has(PROG.bg, s.bg) ? PROG.bg[s.bg] : PROG.bg.space;
  gl.activeTexture(gl.TEXTURE0);
  const tex = textTexture(idx, step, anim);
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
  gl.viewport(0, 0, W, H);

  gl.uniform2f(pr.u.uRes, W, H);
  gl.uniform3fv(pr.u.uAccent, s.rgb);
  gl.uniform1f(pr.u.uCam, cam === undefined ? camTarget(idx, step) : cam);
  gl.uniform1f(pr.u.uDark, (has(DARK, s.bg) ? DARK[s.bg] : true) ? 1 : 0);

  gl.uniform1f(pr.u.uTime, t);
  gl.uniform1f(pr.u.uAsp, W / H);
  gl.uniform2f(pr.u.uRes, W, H);
  gl.uniform3fv(pr.u.uAccent, rgb);

}

// ---------- 尺寸 ----------
let W = 0, H = 0;
// 慢機自動降解像度：連續約 2 秒低過 40 fps，內部解像度降 15%（最低 55%）。?q=1 鎖死解像度（測試用）
const Q_LOCK = QS.has('q') ? Math.min(1, Math.max(0.55, parseFloat(QS.get('q')) || 1)) : 0;
let quality = Q_LOCK || 1, slowT = 0, coolT = 0;
function adapt(dt) {
  if (Q_LOCK || !(dt > 0) || dt > 0.25) return; // 背景 tab 或者卡一下：唔計
  coolT = Math.max(0, coolT - dt);
  slowT = dt > 1 / 40 ? slowT + dt : Math.max(0, slowT - dt);
  if (slowT > 2 && coolT === 0 && quality > 0.56) {
    quality = Math.max(0.55, quality * 0.85);
    slowT = 0; coolT = 3;
    resize();
  }
}
function resize() {
  const cw = Math.max(1, canvas.clientWidth || innerWidth), ch = Math.max(1, canvas.clientHeight || innerHeight);
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  const MAX_PIX = 3.2e6; // 限制像素，慳 GPU
  if (cw * ch * dpr * dpr > MAX_PIX) dpr = Math.sqrt(MAX_PIX / (cw * ch));
  dpr *= quality;
  const w = Math.max(1, Math.round(cw * dpr)), h = Math.max(1, Math.round(ch * dpr));
  if (w === W && h === H) return;
  W = w; H = h;
  canvas.width = W; canvas.height = H;
  textCanvas.width = W; textCanvas.height = H;
  slots.forEach(x => { x.key = ''; });
  if (gl) { fboA = makeTarget(W, H, fboA); fboB = makeTarget(W, H, fboB); }
}

      const len = this.ac.sampleRate * 2, buf = this.ac.createBuffer(1, len, this.ac.sampleRate), d = buf.getChannelData(0);
      let s = 12345;
      for (let k = 0; k < len; k++) { s = (Math.imul(s, 1103515245) + 12345) & 0x7fffffff; d[k] = s / 0x3fffffff - 1; }
      this.noise = buf;
    }
    if (this.ac.state === 'suspended') this.ac.resume();
    return true;
  },
  toggle() { this.on = !this.on && this.init(); return this.on; },
  play(name, dur) {
    const ac = this.ac; if (!ac) return;
    const t0 = ac.currentTime, out = ac.createGain();
    out.gain.value = 0.32; out.connect(ac.destination);
    const whoosh = (len, f0, f1, q, peak) => {
      const src = ac.createBufferSource(); src.buffer = this.noise;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = q;
      bp.frequency.setValueAtTime(f0, t0); bp.frequency.exponentialRampToValueAtTime(f1, t0 + len);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + len * 0.45); g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
      src.connect(bp); bp.connect(g); g.connect(out); src.start(t0); src.stop(t0 + len + 0.05);
    };
    const thump = (at, f0, peak) => {
      const os = ac.createOscillator(), g = ac.createGain();
      os.type = 'sine'; os.frequency.setValueAtTime(f0, t0 + at); os.frequency.exponentialRampToValueAtTime(38, t0 + at + 0.35);
      g.gain.setValueAtTime(0.0001, t0 + at); g.gain.exponentialRampToValueAtTime(peak, t0 + at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + 0.45);
      os.connect(g); g.connect(out); os.start(t0 + at); os.stop(t0 + at + 0.5);
    };
    const L = Math.min(dur, 1.6);
    if (name === 'slam') { whoosh(dur * 0.42, 300, 1800, 0.8, 0.5); thump(dur * 0.42, 140, 1); }
    else if (name === 'glitch') { for (let k = 0; k < 5; k++) whoosh(0.06, 2000 + k * 900, 3000 + k * 500, 6, 0.5); }
    else if (name === 'wash') whoosh(L, 400, 2400, 0.6, 0.6);
    else if (name === 'tear') whoosh(L * 0.6, 1400, 5200, 1.4, 0.55);
    else if (name === 'line') { whoosh(L * 0.5, 4000, 300, 2, 0.4); thump(L * 0.5, 90, 0.4); }
    else whoosh(L, 600, 1600, 0.9, 0.45);
  }
};
function showToast(msg) {
  toastEl.textContent = msg; toastEl.hidden = false; toastEl.style.opacity = '1';
  clearTimeout(showToast.t1); clearTimeout(showToast.t2);
  showToast.t1 = setTimeout(() => { toastEl.style.opacity = '0'; }, 1600);
  showToast.t2 = setTimeout(() => { toastEl.hidden = true; }, 2200);
}

function finish() {
  const tr = state.tr; if (!tr) return;
  camS = camTarget(tr.to, tr.toStep);
  state.i = tr.to; state.step = tr.toStep; state.tr = null; state.revealT0 = -1;
  afterChange();
}
function go(to, toStep, name, reverse) {
  if (state.tr) finish();
  to = Math.max(0, Math.min(N - 1, to | 0));
  toStep = Math.max(0, Math.min(maxStep(SLIDES[to]), toStep | 0));
  if (to === state.i) {
    if (toStep !== state.step) { state.step = toStep; state.revealT0 = -1; afterChange(); }
    return;
  }
  let nm = has(TR, name) ? name : 'fade';
  if (REDUCED || !gl) nm = 'fade';
  if (sound.on && !REDUCED) sound.play(nm, TR[nm].dur);
  state.tr = { from: state.i, fromStep: state.step, to, toStep, name: nm, t0: now(), dur: REDUCED ? 0.45 : TR[nm].dur, reverse: !!reverse };
  afterChange();
}
function next() {
  if (state.tr) { finish(); return; }
  const s = SLIDES[state.i];
  if (state.step < maxStep(s)) { state.step++; state.revealT0 = now(); afterChange(); return; }
  if (state.i < N - 1) go(state.i + 1, 0, s.tr, false);
}
function prev() {
  if (state.tr) { finish(); return; }
  if (state.step > 0) { state.step--; state.revealT0 = -1; afterChange(); return; }
  if (state.i > 0) { const j = state.i - 1; go(j, maxStep(SLIDES[j]), SLIDES[j].tr, true); }
}
function parseHash() {
  let raw = location.hash.slice(1);
  try { raw = decodeURIComponent(raw); } catch (e) { /* 唔理 */ }
  const m = raw.match(/^([a-z0-9_]+)(?:-(\d+))?$/i);
  if (!m) return null;
  const i = SLIDES.findIndex(s => s.id === m[1]);
  if (i < 0) return null;
  return { i, step: Math.min(maxStep(SLIDES[i]), parseInt(m[2] || '0', 10)) };
}

// ---------- 畫面 loop ----------
let raf = 0;
function frame(ms) {
  raf = requestAnimationFrame(frame);
  resize();
  const t = ms / 1000;
  const tPrev = lastT; lastT = t;
  if (FREEZE) { renderFrozen(); return; }
  adapt(t - tPrev);
  if (state.tr && t - state.tr.t0 >= state.tr.dur) finish();
  const q = state.tr;
  if (q) {
    let p = clamp01((t - q.t0) / q.dur);
    let A = q.from, As = q.fromStep, B = q.to, Bs = q.toStep;
    if (q.reverse) { [A, As, B, Bs] = [B, Bs, A, As]; p = 1 - p; }
    if (gl) {
      renderSlideGL(fboA, A, As, 1, t);
      renderSlideGL(fboB, B, Bs, 1, t);
      drawTransitionGL(q.name, p, t, SLIDES[q.to].rgb);
    } else {
      renderSlide2D(A, As, 1, 1);
      renderSlide2D(B, Bs, 1, p * p * (3 - 2 * p));
    }
  } else {
    const anim = state.revealT0 < 0 ? 1 : clamp01((t - state.revealT0) / 0.45);
    const dt = Math.min(0.1, Math.max(0, t - tPrev));
    camS += (camTarget(state.i, state.step) - camS) * (1 - Math.exp(-dt * 2.2));
    if (gl) renderSlideGL(null, state.i, state.step, anim, t, camS);
    else renderSlide2D(state.i, state.step, anim, 1);
  }
}
// ?tr=flaps&p=0.5&a=1&b=2：畫面停喺某款 transition 嘅某一點，方便調 shader
function renderFrozen() {
  const f = FREEZE, t = 12;
  const name = has(TR, f.name) ? f.name : 'fade';
  if (!gl) { renderSlide2D(f.a, maxStep(SLIDES[f.a]), 1, 1); renderSlide2D(f.b, 0, 1, f.p); return; }
  renderSlideGL(fboA, f.a, maxStep(SLIDES[f.a]), 1, t);
  renderSlideGL(fboB, f.b, 0, 1, t);
  drawTransitionGL(name, f.p, t, SLIDES[f.b].rgb);
}

// ---------- 輸入 ----------
function fullscreen() {
  const d = document;
  if (d.fullscreenElement) { if (d.exitFullscreen) d.exitFullscreen(); }
  else if (d.documentElement.requestFullscreen) d.documentElement.requestFullscreen().catch(() => {});
}
function togglePanel(el) { el.hidden = !el.hidden; }
function closePanels() { notesEl.hidden = true; overEl.hidden = true; helpEl.hidden = true; }

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if ((k === 'Enter' || k === ' ') && e.target.closest && e.target.closest('button')) return;
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); prev(); }
  else if (k === 'Home') { e.preventDefault(); go(0, 0, 'fade', true); }
  else if (k === 'End') { e.preventDefault(); go(N - 1, maxStep(SLIDES[N - 1]), 'fade', false); }
  else if (k === 'n' || k === 'N') togglePanel(notesEl);
  else if (k === 'o' || k === 'O') { togglePanel(overEl); if (!overEl.hidden) { const b = overEl.querySelector('button[aria-current="true"]'); if (b) b.focus(); } }
  else if (k === 'f' || k === 'F') fullscreen();
  else if (k === 'm' || k === 'M') showToast(sound.toggle() ? '聲效：開' : '聲效：關');
  else if (k === '?' || k === 'h' || k === 'H') togglePanel(helpEl);
  else if (k === 'Escape') { closePanels(); canvas.focus(); }
});

let px0 = 0, py0 = 0, pt0 = 0, down = false;
function bindPointer(el) {
  el.addEventListener('pointerdown', e => { px0 = e.clientX; py0 = e.clientY; pt0 = performance.now(); down = true; });
  el.addEventListener('pointerup', e => {
    if (!down) return; down = false;
    const dx = e.clientX - px0, dy = e.clientY - py0, dt = performance.now() - pt0;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2) { if (dx < 0) next(); else prev(); return; }
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && dt < 600) { if (e.clientX > innerWidth * 0.38) next(); else prev(); }
  });
  el.addEventListener('pointercancel', () => { down = false; });
  el.addEventListener('webglcontextlost', e => { e.preventDefault(); cancelAnimationFrame(raf); });
  el.addEventListener('webglcontextrestored', () => location.reload());
}
bindPointer(canvas);

addEventListener('hashchange', () => {
  const tgt = parseHash();
  if (tgt) go(tgt.i, tgt.step, 'fade', tgt.i < state.i);
});

// Overview
overEl.innerHTML = '<h2>全部頁面（O 或 Esc 關閉）</h2>';
SLIDES.forEach((s, k) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.innerHTML = '<div class="sw ' + esc(s.bg) + '"></div><span class="n">' + String(k + 1).padStart(2, '0') + ' · ' + esc(s.kicker || '') + '</span><span class="t">' + esc(s.title) + '</span>';
  b.addEventListener('click', () => { overEl.hidden = true; go(k, 0, 'fade', k < state.i); canvas.focus(); });
  overEl.appendChild(b);
});

// 開場提示
const touchy = matchMedia('(pointer: coarse)').matches;
toastEl.textContent = touchy ? '撳右邊或者向左 swipe：下一步' : '按 ? 睇操作，→ 下一步';
setTimeout(() => { toastEl.style.opacity = '0'; }, 3500);
setTimeout(() => { toastEl.hidden = true; }, 4300);

// ---------- 開始 ----------
const start = parseHash();
if (start) { state.i = start.i; state.step = start.step; }
camS = camTarget(state.i, state.step);
resize();
updateUI();
if (!FREEZE) setHash();
canvas.focus({ preventScroll: true });
raf = requestAnimationFrame(frame);

window.deck = { next, prev, go: (i, s) => go(i, s || 0, 'fade', i < state.i), state, slides: SLIDES,
  scenes: Object.keys(DARK), transitions: Object.keys(TR), renderer: gl ? 'webgl2' : '2d', sound,
  get quality() { return quality; } };
})();
</script>
</body>
</html>
