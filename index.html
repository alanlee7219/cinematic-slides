<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>告別悶 Slide · WebGL deck demo</title>
<style>
:root{--panel:rgba(12,14,20,.92);--text:#eef1f6;--dim:#9aa3b2;--sel:#7cc4ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#05070d;overflow:hidden}
body{color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:pointer}
#bar{position:fixed;left:0;bottom:0;height:3px;width:0;background:var(--sel);opacity:.85;transition:width .5s ease,background-color .5s ease;pointer-events:none}
.panel{position:fixed;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#notes{left:0;right:0;bottom:0;padding:16px max(22px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;align-items:start}
#notes p{margin:0;max-width:72ch;font-size:17px}
#notes .meta{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
#over{inset:0;overflow:auto;padding:max(28px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right)) 28px max(28px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:16px;align-content:start}
#over h2{grid-column:1/-1;margin:0 0 4px;font-size:15px;font-weight:600;color:var(--dim)}
#over button{all:unset;cursor:pointer;display:grid;gap:8px;padding:10px;border-radius:12px;outline:2px solid transparent;outline-offset:2px}
#over button:hover,#over button:focus-visible,#over button[aria-current="true"]{outline-color:var(--sel)}
#over .sw{aspect-ratio:16/9;border-radius:8px}
#over .sw.space{background:radial-gradient(circle at 82% 122%,#3b6fe0 0 32%,#16306e 33% 38%,transparent 39%),radial-gradient(circle at 30% 30%,#2a1846,transparent 60%),#070a14}
#over .sw.aurora{background:linear-gradient(180deg,#07122a 0%,#0b2c3a 55%,#1fd18a 78%,#071a1c 100%)}
#over .sw.paper{background:linear-gradient(135deg,#f1ede5,#e2dbcf)}
#over .n{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
#over .t{font-weight:600;line-height:1.35}
#help{right:max(20px,env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));padding:16px 20px;border-radius:12px;display:grid;grid-template-columns:auto auto;gap:5px 18px;max-width:calc(100vw - 40px)}
#help b{font-weight:600;white-space:nowrap}
#help span{color:var(--dim)}
#toast{left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:8px 16px;border-radius:999px;font-size:14px;white-space:nowrap;transition:opacity .6s;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="簡報畫面"></canvas>
<div id="bar"></div>
<div id="notes" class="panel" hidden><p id="notesText"></p><span class="meta" id="notesMeta"></span></div>
<nav id="over" class="panel" hidden aria-label="全部頁面"></nav>
<div id="help" class="panel" hidden role="dialog" aria-label="操作">
  <b>→ / Space / 撳右邊</b><span>下一步</span>
  <b>← / 撳左邊</b><span>上一步</span>
  <b>Swipe</b><span>手機換頁</span>
  <b>N</b><span>Speaker notes</span>
  <b>O</b><span>Overview</span>
  <b>F</b><span>全屏</span>
  <b>Home / End</b><span>第一頁 / 最後一頁</span>
  <b>Esc</b><span>關閉</span>
</div>
<div id="toast" class="panel"></div>
<div id="sr" class="sr" aria-live="polite"></div>
<script>
(() => {
'use strict';

/* =========================================================
   1. 內容：改 SLIDES 就換到成份 deck
   layout: 'hero' | 'list'
   bg:     'space' | 'aurora' | 'paper'
   tr:     去下一頁用嘅 transition：'portal' | 'flaps' | 'dissolve' | 'line' | 'fade'
   body:   每粒 bullet 係一步（按一下出一粒）
   ========================================================= */
const DECK_TITLE = '告別悶 Slide';
const SLIDES = [
  { id: 'intro', layout: 'hero', bg: 'space', tr: 'portal', accent: '#7cc4ff',
    kicker: 'WebGL 簡報 demo', title: '告別悶 Slide',
    sub: '一個 HTML file，做到電影感轉場。',
    notes: '呢份 deck 本身就係 demo：全部用原生 WebGL2 同 GLSL shader 即時畫，冇任何外部 library，離線都開到。按 → 或 Space 開始。' },
  { id: 'what', layout: 'list', bg: 'paper', tr: 'flaps', accent: '#c4471f',
    kicker: '拆解原版', title: 'The Last Boring Slide 係乜',
    body: [
      '單一 HTML file：全屏 canvas，加一層 UI（notes、overview、help）',
      '13 個 scene，大多用 shader 即時計算：山脈、月球、地球、星空',
      '10 款 transition：摺紙、水浪、翻牌、印刷、撕紙、CRT 收線',
      'Fonts 同圖片全部 base64 塞入 file，所以離線都開到'
    ],
    notes: '原版用 three.js 加自寫 GLSL。呢頁只係拆解佢嘅結構；呢份 demo 係重新寫過，冇用原版嘅 code。' },
  { id: 'stack', layout: 'list', bg: 'aurora', tr: 'dissolve', accent: '#5ef2c1',
    kicker: '技術棧', title: '四樣嘢砌成一份 deck',
    body: [
      'WebGL2：所有畫面都喺 GPU 畫',
      'GLSL shader：背景、轉場、光影全部係 code',
      'Canvas 2D：先將文字畫好，再變成 texture',
      'Hash routing：#頁-步，每一步都有自己嘅網址'
    ],
    notes: '極光背景係三層 noise 疊出嚟，每粒 pixel 每個 frame 都重新計。文字就用 Canvas 2D 先畫，再當 texture 交俾 shader。' },
  { id: 'how', layout: 'list', bg: 'paper', tr: 'line', accent: '#2f5bd3',
    kicker: '轉場原理', title: 'Transition 其實係一條公式',
    body: [
      'A 頁同 B 頁各自先畫落一張 offscreen texture',
      '全屏 shader 同時讀 A 同 B',
      'Progress p 由 0 行到 1，shader 決定每粒 pixel 幾時由 A 變 B',
      'p = 1 嗰一刻，正式換頁'
    ],
    notes: 'Dissolve 用 noise 決定 pixel 嘅次序；翻牌將畫面切成 tile，逐塊計角度；CRT 收線將畫面壓成一條線，再拉開下一頁。' },
  { id: 'build', layout: 'list', bg: 'space', tr: 'flaps', accent: '#ffd27a',
    kicker: '製作步驟', title: '自己整一份，分五步',
    body: [
      '定內容：題材、6–10 頁、每頁一句重點',
      '寫 engine：分頁、步驟、鍵盤、swipe、網址',
      '寫 transition：每款一個 fragment shader',
      '加 3D scene：例如星空、地球、極光',
      '打包測試：單一 HTML，喺手機同電腦試 fps'
    ],
    notes: '第一版先做 2–3 款 transition 加 1 個 scene，其餘頁靠排版。之後逐款 transition 慢慢加，每款都可以獨立調。' },
  { id: 'controls', layout: 'list', bg: 'aurora', tr: 'portal', accent: '#b59cff',
    kicker: '操作', title: '點樣用呢份 deck',
    body: [
      '→ / Space / 撳右邊：下一步；← / 撳左邊：上一步',
      'N：speaker notes；O：overview；F：全屏；?：help',
      '手機：左右 swipe 換頁',
      '網址記住你去到邊頁，例如 #how-2'
    ],
    notes: '想預覽某一款 transition，可以喺網址加 ?tr=flaps&p=0.5&a=1&b=2，畫面會停喺第 2 頁去第 3 頁嘅一半。' },
  { id: 'next', layout: 'hero', bg: 'space', tr: 'fade', accent: '#7cc4ff',
    kicker: '下一步', title: '揀題材，換內容',
    sub: '改 index.html 頂部嘅 SLIDES 就換到內容。想要更多轉場，可以再加 fold、wash、tear。',
    notes: '開咗 GitHub Pages 之後，呢個 file 就有自己嘅網址，可以直接 share。' }
];

/* =========================================================
   2. Transition 長度（秒）。每款對應下面一個 shader。
   ========================================================= */
const TR = {
  fade:     { dur: 0.7 },
  dissolve: { dur: 1.6 },
  flaps:    { dur: 1.9 },
  line:     { dur: 1.3 },
  portal:   { dur: 1.5 }
};
// 只認自己定義嘅 key（防 ?tr=constructor 之類）
const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

/* =========================================================
   3. Shaders
   ========================================================= */
const VS = '#version 300 es\n' + `
out vec2 vUv;
void main(){
  vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));
  vUv=p;
  gl_Position=vec4(p*2.-1.,0.,1.);
}`;

const HEAD = '#version 300 es\n' + `
precision highp float;
precision highp int;
in vec2 vUv;
out vec4 o;
uniform float uTime;
uniform float uAsp;
uniform float uP;
uniform vec2 uRes;
uniform vec3 uAccent;
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float hash13(vec3 p3){ p3=fract(p3*.1031); p3+=dot(p3,p3.zyx+31.32); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1.,0.)),u.x),mix(hash12(i+vec2(0.,1.)),hash12(i+vec2(1.,1.)),u.x),u.y); }
float vnoise3(vec3 p){ vec3 i=floor(p), f=fract(p); vec3 u=f*f*(3.-2.*f);
  float a=mix(mix(hash13(i),hash13(i+vec3(1.,0.,0.)),u.x),mix(hash13(i+vec3(0.,1.,0.)),hash13(i+vec3(1.,1.,0.)),u.x),u.y);
  float b=mix(mix(hash13(i+vec3(0.,0.,1.)),hash13(i+vec3(1.,0.,1.)),u.x),mix(hash13(i+vec3(0.,1.,1.)),hash13(i+vec3(1.,1.,1.)),u.x),u.y);
  return mix(a,b,u.z); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*vnoise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s; }
float fbm3(vec3 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*vnoise3(p); p=p*2.02+vec3(1.7,9.2,3.1); a*=.5; } return s; }
float easeIO(float t){ t=clamp(t,0.,1.); return t<.5?4.*t*t*t:1.-pow(-2.*t+2.,3.)*.5; }
`;

// 背景 shader 共用：文字 texture（premultiplied alpha）疊喺背景上面
const TEXT = `
uniform sampler2D tText;
vec3 withText(vec3 bg){ vec4 t=texture(tText,vUv); return bg*(1.-t.a)+t.rgb; }
`;

const STARS = `
vec3 starLayer(vec2 p,float scale,float seed,float thr){
  vec2 g=p*scale; vec2 id=floor(g); vec2 f=fract(g)-.5;
  float h=hash12(id+seed);
  if(h<thr) return vec3(0.);
  vec2 off=vec2(hash12(id+seed+7.1),hash12(id+seed+3.7))-.5;
  float d=length(f-off*.7);
  float tw=.62+.38*sin(uTime*(1.1+2.6*h)+h*80.);
  vec3 col=mix(vec3(1.,.86,.72),vec3(.74,.84,1.),hash12(id+seed+11.3));
  float k=(h-thr)/(1.-thr);
  return col*(1.-smoothstep(0.,.11,d))*tw*(.45+1.6*k);
}
`;

// 星空 + 星雲 + 一個會轉嘅地球（夜面有城市燈）
const BG_SPACE = TEXT + STARS + `
void main(){
  vec2 p=(vUv-.5)*vec2(uAsp,1.);
  vec3 col=vec3(.010,.013,.030)+vec3(.015,.025,.055)*(1.-vUv.y);
  float n=fbm(p*1.25+vec2(uTime*.004,0.));
  float n2=fbm(p*2.6-vec2(0.,uTime*.003)+4.);
  col+=vec3(.11,.045,.21)*smoothstep(.42,.86,n)*.85+vec3(.02,.09,.18)*smoothstep(.45,.92,n2);
  vec2 dr=vec2(uTime*.0025,0.);
  col+=starLayer(p+dr,55.,1.,.965)+starLayer(p+dr*.6,105.,7.,.972)*.8+starLayer(p+dr*.3,190.,13.,.98)*.6;
  bool port=uAsp<1.;
  vec2 C=port?vec2(.15,-.70):vec2(uAsp*.40,-.56);
  float R=port?.48:.64;
  vec2 d=(p-C)/R; float r2=dot(d,d);
  vec3 L=normalize(vec3(.55,.45,.70));
  if(r2<1.){
    float z=sqrt(1.-r2); vec3 nr=vec3(d,z);
    float a=uTime*.02; float ca=cos(a), sa=sin(a);
    vec3 q=vec3(ca*nr.x+sa*nr.z,nr.y,-sa*nr.x+ca*nr.z);
    float land=smoothstep(.50,.56,fbm3(q*1.7+3.1));
    float cl=smoothstep(.47,.78,fbm3(q*2.8+vec3(uTime*.006,0.,0.)+9.));
    vec3 landCol=mix(vec3(.09,.13,.07),vec3(.17,.14,.09),vnoise3(q*6.));
    vec3 alb=mix(vec3(.010,.045,.12),landCol,land);
    float dif=max(dot(nr,L),0.);
    vec3 c=alb*(.025+1.35*dif);
    vec3 Hv=normalize(L+vec3(0.,0.,1.));
    c+=vec3(.85,.92,1.)*pow(max(dot(nr,Hv),0.),70.)*(1.-land)*(1.-cl)*.6;
    c=mix(c,vec3(.90,.93,.97)*(.03+1.05*dif),cl*.75);
    float night=1.-smoothstep(-.10,.10,dot(nr,L));
    float cluster=smoothstep(.45,.75,vnoise3(q*14.+2.));
    float city=land*(1.-cl)*night*cluster*smoothstep(.70,.88,vnoise3(q*150.));
    c+=vec3(1.,.62,.26)*city*1.6;
    float rim=pow(1.-z,2.4);
    c+=vec3(.22,.50,1.)*rim*(.12+.95*smoothstep(-.25,.6,dot(nr,L)));
    float aa=1.-smoothstep(.985,1.,r2);
    col=mix(col,c,aa);
  }
  float r=sqrt(r2);
  float side=.30+.70*smoothstep(-.5,.8,dot(d/max(r,1e-4),normalize(L.xy)));
  col+=vec3(.18,.42,1.)*exp(-max(r-1.,0.)*10.)*.55*side*step(.985,r2);
  vec2 v=vUv-.5; col*=1.-.55*dot(v,v);
  o=vec4(withText(col),1.);
}`;

// 極光：三層 noise 簾幕，下緣利、向上慢慢散
const BG_AURORA = TEXT + STARS + `
void main(){
  vec2 p=(vUv-.5)*vec2(uAsp,1.);
  vec3 col=mix(vec3(.006,.012,.030),vec3(.014,.038,.075),vUv.y);
  col+=starLayer(p,95.,5.,.972)*.7+starLayer(p,175.,9.,.98)*.5;
  float t=uTime*.05;
  for(int i=0;i<3;i++){
    float fi=float(i);
    float w=fbm(vec2(p.x*.85+fi*3.1+t,fi*1.7+t*.4));
    float yC=-.22+fi*.09+(w-.5)*.55;
    float dy=p.y-yC;
    float streak=.40+.60*vnoise(vec2(p.x*34.+w*14.+fi*10.,t*2.5+fi));
    float I=(dy<0.?exp(-dy*dy*380.):exp(-dy*2.8))*streak;
    vec3 ac=mix(vec3(.12,1.,.55),vec3(.58,.30,1.),smoothstep(0.,.45,dy));
    ac=mix(ac,uAccent,.22);
    col+=ac*I*(.40-fi*.09);
  }
  col+=vec3(.04,.18,.14)*exp(-vUv.y*7.)*.4;
  vec2 v=vUv-.5; col*=1.-.5*dot(v,v);
  col=col/(1.+col*.3);
  o=vec4(withText(col),1.);
}`;

// 紙：纖維、紙紋、少少光暗
const BG_PAPER = TEXT + `
void main(){
  vec2 p=(vUv-.5)*vec2(uAsp,1.);
  float f=fbm(p*vec2(9.,7.));
  float g=vnoise(p*uRes.y*.33)-.5;
  float m=fbm(p*2.2+5.)-.5;
  vec3 col=vec3(.936,.918,.884)*(1.+(f-.5)*.05+g*.03+m*.04);
  float fib=smoothstep(.70,.96,vnoise(vec2(p.x*230.+fbm(p*28.)*6.,p.y*17.)));
  col*=1.-.03*fib;
  vec2 v=vUv-vec2(.40,.62); col*=1.-.22*dot(v,v);
  o=vec4(withText(col),1.);
}`;

const TR_FADE = `
uniform sampler2D tA,tB;
void main(){ vec3 a=texture(tA,vUv).rgb, b=texture(tB,vUv).rgb; o=vec4(mix(a,b,smoothstep(0.,1.,uP)),1.); }`;

// 燒穿：noise 決定每粒 pixel 幾時變，邊緣發光
const TR_DISSOLVE = `
uniform sampler2D tA,tB;
void main(){
  vec2 q=vUv*vec2(uAsp,1.);
  float n=fbm(q*2.6)*.8+vnoise(q*22.)*.2;
  n=clamp((n-.18)/.64,0.,1.);
  n=mix(n,1.-vUv.y,.3);
  float e=.06;
  float t=easeIO(uP)*(1.+2.*e)-e;
  float d=n-t;
  vec3 a=texture(tA,vUv).rgb, b=texture(tB,vUv).rgb;
  float k=1.-smoothstep(-.004,.004,d);
  float live=smoothstep(0.,.06,uP)*(1.-smoothstep(.94,1.,uP));
  a*=1.-.75*(1.-smoothstep(0.,e*1.6,d))*live;
  vec3 c=mix(a,b,k);
  float glow=exp(-abs(d)*55.)*live;
  vec3 gc=mix(vec3(1.,.38,.08),vec3(1.,.86,.55),exp(-abs(d)*140.));
  c+=gc*glow*1.05;
  o=vec4(c,1.);
}`;

// 翻牌：畫面切成 tile，一浪一浪咁翻過去
const TR_FLAPS = `
uniform sampler2D tA,tB;
void main(){
  float rows=9.;
  float cols=max(3.,floor(rows*uAsp+.5));
  vec2 grid=vec2(cols,rows);
  vec2 g=vUv*grid; vec2 id=min(floor(g),grid-1.); vec2 f=g-id;
  float diag=(id.x/max(cols-1.,1.))*.6+(1.-id.y/max(rows-1.,1.))*.4;
  float s=diag*.55+hash12(id+3.7)*.1;
  float lp=clamp((uP-s)/.35,0.,1.);
  if(lp<=0.){ o=vec4(textureLod(tA,vUv,0.).rgb,1.); return; }
  if(lp>=1.){ o=vec4(textureLod(tB,vUv,0.).rgb,1.); return; }
  float th=easeIO(lp)*3.14159265;
  float cs=cos(th), sn=sin(th);
  float c=f.y-.5;
  float ly=c/max(abs(cs),.001);
  bool back=th>1.5707963;
  float w=1.+.28*sn*(back?-1.:1.)*(ly*2.);
  float lx=(f.x-.5)/max(w,.05);
  vec3 col=vec3(.02,.022,.03);
  if(abs(ly)<=.5&&abs(lx)<=.5){
    vec2 tuv=(id+vec2(lx,ly)+.5)/grid;
    vec3 face=back?textureLod(tB,tuv,0.).rgb:textureLod(tA,tuv,0.).rgb;
    float shade=.55+.45*abs(cs);
    float spec=pow(max(0.,1.-abs(th-1.5707963)/.6),3.)*.16;
    float edge=1.-smoothstep(.47,.5,max(abs(lx),abs(ly)));
    col=face*shade+spec;
    col*=.72+.28*edge;
  }
  o=vec4(col,1.);
}`;

// 舊 CRT 熄機：壓成一條線、縮成一點，再由一點拉開下一頁
const TR_LINE = `
uniform sampler2D tA,tB;
vec3 sampleRGB(bool first,vec2 uv,float ca){
  if(first) return vec3(textureLod(tA,uv+vec2(ca,0.),0.).r,textureLod(tA,uv,0.).g,textureLod(tA,uv-vec2(ca,0.),0.).b);
  return vec3(textureLod(tB,uv+vec2(ca,0.),0.).r,textureLod(tB,uv,0.).g,textureLod(tB,uv-vec2(ca,0.),0.).b);
}
void main(){
  vec2 c=vUv-.5;
  bool first=uP<.5;
  float k=first?uP*2.:(uP-.5)*2.;
  float sx, sy;
  if(first){
    float a=clamp(k/.62,0.,1.); a=a*a*a;
    float b=clamp((k-.62)/.38,0.,1.); b=b*b;
    sy=mix(1.,.0035,a); sx=mix(1.,0.,b);
  } else {
    float a=clamp(k/.38,0.,1.); a=1.-(1.-a)*(1.-a);
    float b=clamp((k-.38)/.62,0.,1.); b=1.-(1.-b)*(1.-b)*(1.-b);
    sx=a; sy=mix(.0035,1.,b);
  }
  sx=max(sx,.002);
  vec2 src=c/vec2(sx,sy)+.5;
  vec3 col=vec3(0.);
  if(src.x>=0.&&src.x<=1.&&src.y>=0.&&src.y<=1.){
    float ca=.006*(1.-sy);
    vec3 s=sampleRGB(first,src,ca);
    float gain=1.+2.2*pow(1.-sy,4.);
    float scan=.9+.1*sin(vUv.y*uRes.y*3.14159);
    col=s*gain*mix(1.,scan,1.-sy);

  float lineG=exp(-abs(c.y)*uRes.y*.08)*exp(-max(abs(c.x)-sx*.5,0.)*30.)*hot;
  float dotG=exp(-length(c*vec2(uAsp,1.))*24.)*(1.-sx)*hot;
  col+=vec3(.85,.92,1.)*(lineG*.9+dotG*1.4);

// 光圈：下一頁喺中間開一個圓，舊一頁向你推埋嚟
const TR_PORTAL = `
uniform sampler2D tA,tB;
void main(){
  vec2 c=vUv-.5; vec2 q=c*vec2(uAsp,1.);
  float r=length(q);
  float maxR=length(vec2(uAsp,1.))*.5+.06;
  float e=easeIO(uP);
  float R=e*maxR;
  float zA=1.+.55*e;
  vec3 a=vec3(0.);
  for(int i=0;i<6;i++){ float fi=float(i)/5.; a+=textureLod(tA,.5+c/(zA*(1.+.07*e*fi)),0.).rgb; }
  a/=6.;
  a*=1.-.55*e;

  float rim=clamp((R-r)/.25,0.,1.);
  float bulge=(1.-rim)*.22*(1.-e);

  float inside=(1.-smoothstep(R-.004,R+.004,r))*smoothstep(0.,.02,uP);
  vec3 col=mix(a,b,inside);

/* =========================================================
   4. Engine
   ========================================================= */
const $ = id => document.getElementById(id);
let canvas = $('stage');
const N = SLIDES.length;
const maxStep = s => (s.layout === 'list' && s.body) ? s.body.length : 0;
const hexRGB = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp01 = x => Math.max(0, Math.min(1, x));
SLIDES.forEach(s => { s.rgb = hexRGB(s.accent); });

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const QS = new URLSearchParams(location.search);
const intParam = (k, d) => { const v = parseInt(QS.get(k) ?? d, 10); return Number.isFinite(v) ? Math.min(N - 1, Math.max(0, v)) : d; };
const FREEZE = QS.has('tr') ? {
  name: QS.get('tr'),
  p: clamp01(parseFloat(QS.get('p') ?? '0.5') || 0),
  a: intParam('a', 0),
  b: intParam('b', 1)
} : null;

const state = { i: 0, step: 0, tr: null, revealT0: -1 };

// ---------- 文字：Canvas 2D 畫好，再上載做 texture ----------
const textCanvas = document.createElement('canvas');
const tctx = textCanvas.getContext('2d');
const FONT = '"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
// wrap:begin（tests/wrap.test.mjs 會讀呢段）
const CJK = /[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF\u3000-\u303F]/;
const NO_START = /^[，。、；：！？）」』】》〉,.;:!?)\]]/;

function tokenize(str) {
  const out = []; let buf = '';
  for (const ch of str) {
    if (CJK.test(ch)) { if (buf) { out.push(buf); buf = ''; } out.push(ch); }
    else if (ch === ' ') { buf += ch; out.push(buf); buf = ''; }
    else buf += ch;
  }
  if (buf) out.push(buf);
  return out;
}
function wrap(g, str, maxW) {
  const out = [];
  const width = toks => g.measureText(toks.join('').trimEnd()).width;
  for (const para of String(str).split('\n')) {
    const lines = [[]];
    for (const tk of tokenize(para)) {
      const cur = lines[lines.length - 1];
      if (cur.length && width(cur.concat(tk)) > maxW && !NO_START.test(tk)) lines.push([tk.trimStart()]);
      else cur.push(tk);
    }
    // 避免最後一行得一兩隻字，亦唔好用標點開頭
    if (lines.length > 1) {
      const last = lines[lines.length - 1], before = lines[lines.length - 2];
      while (before.length > 1 && ([...last.join('').trim()].length <= 3 || NO_START.test(last[0]))) {
        const moved = before.pop();
        last.unshift(moved);
        if (width(last) > maxW) { last.shift(); before.push(moved); break; }
      }
    }
    for (const l of lines) out.push(l.join('').trim());

}
// wrap:end
function spacing(g, px) { if ('letterSpacing' in g) g.letterSpacing = px + 'px'; }
const easeOut = t => 1 - Math.pow(1 - clamp01(t), 3);

function drawSlide(g, s, step, anim, W, H) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, W, H);
  const portrait = W < H * 0.95;
  const S = portrait ? W / 1000 : Math.min(W / 1920, H / 1080);
  const dark = s.bg !== 'paper';
  const ink = dark ? '#f3f6fb' : '#17171c';
  const soft = dark ? 'rgba(222,229,242,0.84)' : 'rgba(40,40,48,0.78)';
  const mx = (portrait ? 70 : 150) * S;
  const maxW = W - mx * 2 - (portrait ? 0 : 300 * S);
  let y = s.layout === 'hero' ? H * (portrait ? 0.24 : 0.28) : (portrait ? 160 : 140) * S;
  g.textAlign = 'left';
  g.textBaseline = 'alphabetic';
  if (dark) { g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = 22 * S; g.shadowOffsetY = 2 * S; }
  else { g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0; }

  if (s.kicker) {
    const ks = 26 * S;
    g.font = `700 ${ks}px ${FONT}`; g.fillStyle = s.accent; spacing(g, 3 * S);
    y += ks; g.fillText(s.kicker, mx, y); spacing(g, 0);
    g.fillRect(mx, y + 16 * S, 56 * S, 4 * S);
    y += 54 * S;
  }
  const ts = (s.layout === 'hero' ? 124 : 80) * S;
  g.font = `800 ${ts}px ${FONT}`; g.fillStyle = ink;
  for (const line of wrap(g, s.title, maxW)) { y += ts * 1.1; g.fillText(line, mx, y); }

  if (s.sub) {
    const ss = 38 * S;
    g.font = `500 ${ss}px ${FONT}`; g.fillStyle = soft; y += 24 * S;
    for (const line of wrap(g, s.sub, maxW)) { y += ss * 1.45; g.fillText(line, mx, y); }
  }
  if (s.layout === 'list' && s.body) {
    const bs = (portrait ? 44 : 40) * S, lh = bs * 1.5, ind = 46 * S;
    g.font = `500 ${bs}px ${FONT}`; y += 46 * S;
    for (let k = 0; k < s.body.length; k++) {
      const a = k < step - 1 ? 1 : (k === step - 1 ? easeOut(anim) : 0);
      if (a <= 0) continue;
      g.globalAlpha = a;
      const dy = (1 - a) * 26 * S;
      const base0 = y + lh;
      g.fillStyle = s.accent;
      g.beginPath(); g.arc(mx + 9 * S, base0 - bs * 0.36 + dy, 7 * S, 0, Math.PI * 2); g.fill();
      g.fillStyle = ink;
      for (const line of wrap(g, s.body[k], maxW - ind)) { y += lh; g.fillText(line, mx + ind, y + dy); }
      y += bs * 0.55;
      g.globalAlpha = 1;
    }
  }
  g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;
  const fs = 22 * S, fy = H - (portrait ? 110 : 70) * S;
  g.font = `600 ${fs}px ${FONT}`; g.fillStyle = soft;
  g.fillText(DECK_TITLE, mx, fy);
  g.textAlign = 'right';
  const idx = SLIDES.indexOf(s);
  g.fillText(String(idx + 1).padStart(2, '0') + ' / ' + String(N).padStart(2, '0'), W - mx, fy);
  g.textAlign = 'left';
}

// ---------- WebGL2 ----------
let gl = null, PROG = null, fboA = null, fboB = null, ctx2d = null;
const UNIFORMS = ['uTime', 'uAsp', 'uP', 'uRes', 'uAccent', 'tText', 'tA', 'tB'];

function compile(type, src) {

}
function buildPrograms() {

  return {
    bg: { space: mk(BG_SPACE), aurora: mk(BG_AURORA), paper: mk(BG_PAPER) },
    tr: { fade: mk(TR_FADE), dissolve: mk(TR_DISSOLVE), flaps: mk(TR_FLAPS), line: mk(TR_LINE), portal: mk(TR_PORTAL) }

function texParams() {

  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  texParams();

  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);

try {
  gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
} catch (e) { gl = null; }
if (gl) {
  try {
    PROG = buildPrograms();
    gl.bindVertexArray(gl.createVertexArray());
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.BLEND);
  } catch (err) {
    console.error(err);
    PROG = null;
  }
}
if (!PROG) {
  // 冇 WebGL2：換一塊新 canvas，用 2D 簡單版（淡入淡出）
  if (gl) { const c2 = canvas.cloneNode(); canvas.replaceWith(c2); canvas = c2; }
  gl = null;
  ctx2d = canvas.getContext('2d');
  console.warn('WebGL2 unavailable: using the 2D fallback.');
}

// 文字 texture 用三個 slot 輪住用（LRU），慳 GPU 記憶體
const slots = [0, 1, 2].map(() => ({ key: '', tex: null, used: 0 }));
let useClock = 0;
function textTexture(idx, step, anim) {
  const key = idx + '|' + step + '|' + (anim >= 1 ? 1 : Math.round(anim * 60)) + '|' + W + 'x' + H;
  useClock++;
  let slot = slots.find(x => x.key === key);
  if (!slot) {
    slot = slots.reduce((m, x) => (x.used < m.used ? x : m), slots[0]);
    drawSlide(tctx, SLIDES[idx], step, anim, W, H);
    if (!slot.tex) { slot.tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, slot.tex); texParams(); }
    else gl.bindTexture(gl.TEXTURE_2D, slot.tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, textCanvas);
    slot.key = key;
  }

function renderSlideGL(target, idx, step, anim, t) {
  const s = SLIDES[idx];
  const pr = has(PROG.bg, s.bg) ? PROG.bg[s.bg] : PROG.bg.space;
  gl.activeTexture(gl.TEXTURE0);
  const tex = textTexture(idx, step, anim);
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(pr.p);
  gl.uniform1f(pr.u.uTime, t);
  gl.uniform1f(pr.u.uAsp, W / H);
  gl.uniform2f(pr.u.uRes, W, H);
  gl.uniform3fv(pr.u.uAccent, s.rgb);

function drawTransitionGL(name, p, t, rgb) {

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(pr.p);
  gl.uniform1f(pr.u.uP, p);
  gl.uniform1f(pr.u.uTime, t);
  gl.uniform1f(pr.u.uAsp, W / H);
  gl.uniform2f(pr.u.uRes, W, H);

// 2D 後備：純色背景 + 文字
const BG2D = { space: '#060912', aurora: '#071422', paper: '#ece7de' };
function renderSlide2D(idx, step, anim, alpha) {
  drawSlide(tctx, SLIDES[idx], step, anim, W, H);
  ctx2d.globalAlpha = alpha;
  ctx2d.fillStyle = BG2D[SLIDES[idx].bg] || BG2D.space;
  ctx2d.fillRect(0, 0, W, H);
  ctx2d.drawImage(textCanvas, 0, 0);
  ctx2d.globalAlpha = 1;
}

// ---------- 尺寸 ----------
let W = 0, H = 0;
function resize() {
  const cw = Math.max(1, canvas.clientWidth || innerWidth), ch = Math.max(1, canvas.clientHeight || innerHeight);
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  const MAX_PIX = 3.2e6; // 限制像素，慳 GPU
  if (cw * ch * dpr * dpr > MAX_PIX) dpr = Math.sqrt(MAX_PIX / (cw * ch));
  const w = Math.max(1, Math.round(cw * dpr)), h = Math.max(1, Math.round(ch * dpr));
  if (w === W && h === H) return;
  W = w; H = h;
  canvas.width = W; canvas.height = H;
  textCanvas.width = W; textCanvas.height = H;
  slots.forEach(x => { x.key = ''; });
  if (gl) { fboA = makeTarget(W, H, fboA); fboB = makeTarget(W, H, fboB); }
}

// ---------- 導航 ----------
const notesEl = $('notes'), notesText = $('notesText'), notesMeta = $('notesMeta');
const overEl = $('over'), helpEl = $('help'), toastEl = $('toast'), barEl = $('bar'), srEl = $('sr');

function shown() { return state.tr ? { i: state.tr.to, step: state.tr.toStep } : { i: state.i, step: state.step }; }
function updateUI() {
  const { i, step } = shown();
  const s = SLIDES[i], m = maxStep(s);
  notesText.textContent = s.notes || '（呢頁冇 notes）';
  notesMeta.textContent = String(i + 1).padStart(2, '0') + ' / ' + String(N).padStart(2, '0') + (m ? ' · ' + step + '/' + m : '');
  barEl.style.width = (((i + (m ? step / m : 1)) / N) * 100).toFixed(2) + '%';
  barEl.style.backgroundColor = s.accent;
  overEl.querySelectorAll('button').forEach((b, k) => b.setAttribute('aria-current', k === i ? 'true' : 'false'));
  srEl.textContent = [s.kicker, s.title, s.sub].concat((s.body || []).slice(0, step)).filter(Boolean).join('。');
}
function setHash() {
  const { i, step } = shown();
  const h = '#' + SLIDES[i].id + '-' + step;
  if (location.hash !== h) history.replaceState(null, '', location.pathname + location.search + h);
}
function afterChange() { setHash(); updateUI(); }
function now() { return performance.now() / 1000; }

function finish() {
  const tr = state.tr; if (!tr) return;
  state.i = tr.to; state.step = tr.toStep; state.tr = null; state.revealT0 = -1;
  afterChange();
}
function go(to, toStep, name, reverse) {

  toStep = Math.max(0, Math.min(maxStep(SLIDES[to]), toStep | 0));
  if (to === state.i) {
    if (toStep !== state.step) { state.step = toStep; state.revealT0 = -1; afterChange(); }
    return;
  }
  let nm = has(TR, name) ? name : 'fade';
  if (REDUCED || !gl) nm = 'fade';
  state.tr = { from: state.i, fromStep: state.step, to, toStep, name: nm, t0: now(), dur: REDUCED ? 0.45 : TR[nm].dur, reverse: !!reverse };
  afterChange();
}

  if (state.i < N - 1) go(state.i + 1, 0, s.tr, false);
}

  if (!m) return null;
  const i = SLIDES.findIndex(s => s.id === m[1]);
  if (i < 0) return null;
  return { i, step: Math.min(maxStep(SLIDES[i]), parseInt(m[2] || '0', 10)) };
}

// ---------- 畫面 loop ----------
let raf = 0;
function frame(ms) {
  raf = requestAnimationFrame(frame);
  resize();
  const t = ms / 1000;
  if (FREEZE) { renderFrozen(); return; }
  if (state.tr && t - state.tr.t0 >= state.tr.dur) finish();
  const q = state.tr;
  if (q) {
    let p = clamp01((t - q.t0) / q.dur);
    let A = q.from, As = q.fromStep, B = q.to, Bs = q.toStep;
    if (q.reverse) { [A, As, B, Bs] = [B, Bs, A, As]; p = 1 - p; }
    if (gl) {
      renderSlideGL(fboA, A, As, 1, t);
      renderSlideGL(fboB, B, Bs, 1, t);
      drawTransitionGL(q.name, p, t, SLIDES[q.to].rgb);
    } else {
      renderSlide2D(A, As, 1, 1);
      renderSlide2D(B, Bs, 1, p * p * (3 - 2 * p));
    }
  } else {
    const anim = state.revealT0 < 0 ? 1 : clamp01((t - state.revealT0) / 0.45);
    if (gl) renderSlideGL(null, state.i, state.step, anim, t);
    else renderSlide2D(state.i, state.step, anim, 1);
  }
}
// ?tr=flaps&p=0.5&a=1&b=2：畫面停喺某款 transition 嘅某一點，方便調 shader
function renderFrozen() {
  const f = FREEZE, t = 12;
  const name = has(TR, f.name) ? f.name : 'fade';
  if (!gl) { renderSlide2D(f.a, maxStep(SLIDES[f.a]), 1, 1); renderSlide2D(f.b, 0, 1, f.p); return; }
  renderSlideGL(fboA, f.a, maxStep(SLIDES[f.a]), 1, t);
  renderSlideGL(fboB, f.b, 0, 1, t);
  drawTransitionGL(name, f.p, t, SLIDES[f.b].rgb);
}

// ---------- 輸入 ----------
function fullscreen() {
  const d = document;
  if (d.fullscreenElement) { if (d.exitFullscreen) d.exitFullscreen(); }
  else if (d.documentElement.requestFullscreen) d.documentElement.requestFullscreen().catch(() => {});
}
function togglePanel(el) { el.hidden = !el.hidden; }
function closePanels() { notesEl.hidden = true; overEl.hidden = true; helpEl.hidden = true; }

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if ((k === 'Enter' || k === ' ') && e.target.closest && e.target.closest('button')) return;
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); prev(); }
  else if (k === 'Home') { e.preventDefault(); go(0, 0, 'fade', true); }
  else if (k === 'End') { e.preventDefault(); go(N - 1, maxStep(SLIDES[N - 1]), 'fade', false); }
  else if (k === 'n' || k === 'N') togglePanel(notesEl);
  else if (k === 'o' || k === 'O') { togglePanel(overEl); if (!overEl.hidden) { const b = overEl.querySelector('button[aria-current="true"]'); if (b) b.focus(); } }
  else if (k === 'f' || k === 'F') fullscreen();
  else if (k === '?' || k === 'h' || k === 'H') togglePanel(helpEl);
  else if (k === 'Escape') { closePanels(); canvas.focus(); }
});

let px0 = 0, py0 = 0, pt0 = 0, down = false;

  el.addEventListener('pointerup', e => {
    if (!down) return; down = false;
    const dx = e.clientX - px0, dy = e.clientY - py0, dt = performance.now() - pt0;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2) { if (dx < 0) next(); else prev(); return; }
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && dt < 600) { if (e.clientX > innerWidth * 0.38) next(); else prev(); }
  });
  el.addEventListener('pointercancel', () => { down = false; });
  el.addEventListener('webglcontextlost', e => { e.preventDefault(); cancelAnimationFrame(raf); });
  el.addEventListener('webglcontextrestored', () => location.reload());
}
bindPointer(canvas);

addEventListener('hashchange', () => {
  const tgt = parseHash();
  if (tgt) go(tgt.i, tgt.step, 'fade', tgt.i < state.i);
});

// Overview
overEl.innerHTML = '<h2>全部頁面（O 或 Esc 關閉）</h2>';
SLIDES.forEach((s, k) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.innerHTML = '<div class="sw ' + esc(s.bg) + '"></div><span class="n">' + String(k + 1).padStart(2, '0') + ' · ' + esc(s.kicker || '') + '</span><span class="t">' + esc(s.title) + '</span>';
  b.addEventListener('click', () => { overEl.hidden = true; go(k, 0, 'fade', k < state.i); canvas.focus(); });
  overEl.appendChild(b);
});

// 開場提示
const touchy = matchMedia('(pointer: coarse)').matches;
toastEl.textContent = touchy ? '撳右邊或者向左 swipe：下一步' : '按 ? 睇操作，→ 下一步';
setTimeout(() => { toastEl.style.opacity = '0'; }, 3500);
setTimeout(() => { toastEl.hidden = true; }, 4300);

// ---------- 開始 ----------
const start = parseHash();
if (start) { state.i = start.i; state.step = start.step; }
resize();
updateUI();
if (!FREEZE) setHash();
canvas.focus({ preventScroll: true });
raf = requestAnimationFrame(frame);

window.deck = { next, prev, go: (i, s) => go(i, s || 0, 'fade', i < state.i), state, slides: SLIDES };
})();
</script>
</body>
</html>
